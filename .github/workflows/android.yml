name: Build Vortex APK

# Builds the Android WebView app in android/ into an installable APK using
# GitHub's runners (which ship the official Android SDK), then publishes it as
# a downloadable release asset. Trigger: push to android/, or run manually.

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vortex.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vortex-apk
          path: vortex.apk

      - name: Publish APK to a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Vortex Android APK
          body: |
            Installable Vortex Android app (debug-signed WebView wrapper of vortex.sarl).
            Download vortex.apk below, open it on your Android phone, and allow install
            from unknown sources when prompted.
          files: vortex.apk
